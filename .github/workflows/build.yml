name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
            app_icon_name: AppIconLegacy
          - platform: macOS
            destination: platform=macOS
            app_icon_name: AppIconLegacy
          - platform: tvOS
            destination: generic/platform=tvOS
            app_icon_name: AppIconTV

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ${{ matrix.platform }}
        run: |
          build_settings=()
          if [ -n "${{ matrix.app_icon_name }}" ]; then
            build_settings+=(ASSETCATALOG_COMPILER_APPICON_NAME="${{ matrix.app_icon_name }}")
          fi

          xcodebuild \
            -project 2048.xcodeproj \
            -scheme 2048 \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.platform }}" \
            CODE_SIGNING_ALLOWED=NO \
            "${build_settings[@]}" \
            build

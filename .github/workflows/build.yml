name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
          - platform: macOS
            destination: platform=macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ${{ matrix.platform }}
        run: |
          xcodebuild \
            -project 2048.xcodeproj \
            -scheme 2048 \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.platform }}" \
            CODE_SIGNING_ALLOWED=NO \
            build
